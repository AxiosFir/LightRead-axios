<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>LightRead 轻阅 — 开源电子书阅读器、PDF 翻译与点睛阅读</title>
    <meta name="description" content="LightRead 轻阅是一款开源、本地优先的电子书与 PDF 阅读器。支持 EPUB、MOBI、AZW3、TXT、Markdown，提供 PDF 对照翻译、点睛阅读、书库与书单、阅读记录和听书。本地阅读无需账号，无需联网。" />
    <meta name="keywords" content="LightRead,轻阅,开源电子书阅读器,PDF阅读器,PDF翻译,点睛阅读,EPUB,MOBI,AZW3,本地书库,书单,阅读记录,听书,OPDS" />
    <meta name="author" content="云中江树" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="LightRead 轻阅 — 开源电子书阅读器、PDF 翻译与点睛阅读" />
    <meta property="og:description" content="让想读的书，变成读进去的书。PDF 对照翻译、点睛阅读、本地书库、书单、阅读记录与听书，陪你从找到一本书到读懂它。" />
    <meta property="og:locale" content="zh_CN" />
    <meta property="og:site_name" content="LightRead 轻阅" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="LightRead 轻阅 — 开源电子书阅读器、PDF 翻译与点睛阅读" />
    <meta name="twitter:description" content="开源、本地优先。用 PDF 对照翻译读懂外文，用点睛阅读抓住重点，用书单和阅读记录积累每一天。" />
    <meta name="theme-color" content="#1664FF" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
    <script>
      // 系统 WebView / 浏览器过旧 (低于 Chrome 89 / Safari 15) 时模块脚本无法运行, 给出提示而不是白屏
      window.addEventListener('load', function () {
        setTimeout(function () {
          if (window.__lightreadBoot) return
          var el = document.getElementById('app')
          if (!el || el.children.length) return
          el.innerHTML = '<div style="max-width:420px;margin:20vh auto 0;padding:0 16px;font:15px/1.7 system-ui,sans-serif;color:#333;text-align:center">' +
            '<p style="font-size:18px;font-weight:600">轻阅无法在当前系统 WebView / 浏览器中运行</p>' +
            '<p>请在应用商店更新「Android System WebView」或 Chrome（需 89 及以上），或使用新版浏览器后重试。</p>' +
            '<p style="color:#888">LightRead needs a newer WebView / browser (Chrome 89+ or Safari 15+). Please update Android System WebView or your browser.</p></div>'
        }, 3000)
      })
    </script>
  </body>
</html>
